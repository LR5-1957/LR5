<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-labelledby="t">
  <title id="t">Lino, le jeune lynx des Alpes, mascotte de LR5, en maillot rayé rouge et noir numéro 5</title>
